<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontak — Refin Agus Saputra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="kontak">
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html"><span class="dot"></span><span data-nav-name>Refin</span></a>
      <nav class="nav-links" id="nav-links">
        <a href="index.html">Beranda</a>
        <a href="tentang.html">Tentang</a>
        <a href="pengalaman.html">Pengalaman</a>
        <a href="skill.html">Skill</a>
        <a href="proyek.html">Proyek</a>
        <a href="galeri.html">Galeri</a>
        <a href="kontak.html" class="active">Kontak</a>
        <button class="theme-btn" aria-label="Ganti tema">☀️</button>
      </nav>
      <button class="burger" aria-label="Menu">☰</button>
    </div>
  </header>

  <main class="section container" style="max-width:720px">
    <span class="eyebrow">Hubungi</span>
    <h1>Kirim Pesan</h1>
    <p class="muted">Formulir ini menyampaikan pesan langsung ke dashboard admin — cocok untuk rekruter, tim magang, atau kolaborasi proyek.</p>

    <form class="form card" style="padding:26px;margin-top:26px" id="form-kontak" novalidate>
      <div class="grid-form">
        <label>Nama <span class="req">*</span>
          <input name="name" type="text" required autocomplete="name" placeholder="Nama lengkap">
        </label>
        <label>Email <span class="req">*</span>
          <input name="email" type="email" required autocomplete="email" placeholder="nama@email.com">
        </label>
        <label class="full">Pesan <span class="req">*</span>
          <textarea name="message" required placeholder="Tulis pesan Anda di sini…"></textarea>
        </label>
      </div>
      <!-- honeypot anti-spam -->
      <label class="hp-field" aria-hidden="true">Website
        <input name="website" type="text" tabindex="-1" autocomplete="off">
      </label>
      <button class="btn btn-primary" type="submit">Kirim Pesan →</button>
      <p id="kontak-ok" class="pill pill-ok" hidden style="justify-content:center">✔ Pesan terkirim — terima kasih!</p>
    </form>
  </main>

  <footer>
    <div class="container foot-inner">
      <span class="muted">© <span id="foot-year"></span> <span data-nav-name></span> · Teknik Informatika ITERA</span>
    </div>
  </footer>

  <script src="assets/js/seed.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
